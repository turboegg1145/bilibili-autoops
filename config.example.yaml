# Bilibili 自动化运营系统配置文件
app:
  name: "Bilibili-AutoOps"
  version: "1.0.0"
  log_level: "INFO"
  data_dir: "./data"
  inbox_dir: "./inbox"
  archive_dir: "./archive"
  reports_dir: "./reports"

# 认证配置
auth:
  credential_file: "./data/credentials.json"
  auto_refresh: true
  refresh_interval_hours: 24

# 自动投稿配置
uploader:
  default_tid: 17             # 默认分区 ID (17: 游戏, 122: 科技-野生技术协会, 188: 科技-计算机技术, etc.)
  default_copyright: 1        # 1: 原创, 2: 转载
  default_source: "AI运营自动化"
  default_tags:
    - "AI"
    - "科技"
    - "自动化"
  watch_interval_seconds: 60  # inbox 扫描间隔 (秒)
  auto_archive: true          # 发布成功后是否移动到 archive/

# 粉丝互动配置
interaction:
  enabled: true
  check_interval_seconds: 300 # 轮询评论/私信间隔 (秒)
  recent_videos_count: 5      # 监听最近发布的视频数量
  auto_like_positive: true    # 自动给好评点赞
  reply_mode: "rule"          # 回复模式: "rule" (规则匹配) 或 "llm" (大模型生成)
  
  # 黑名单配置 (严禁回复本人、系统号或特定用户)
  blacklist_uids:
    - 3546972533295723        # Antigravy 本人 UID
  blacklist_unames:
    - "antigravy"
    - "UP主小助手"
    - "哔哩哔哩智能机"
    - "社区中心"
    - "系统通知"

  # 规则模式预设回复
  rules:
    - keywords: ["求更新", "催更", "快更新"]
      replies:
        - "催更收到！正在快马加鞭制作中，下一期马上就来！🔥"
        - "已经在生产流水线上了，关注不迷路，敬请期待！✨"
    - keywords: ["厉害", "666", "牛", "太强了", "好活"]
      replies:
        - "感谢小伙伴的支持与认可！会继续加油的！🎉"
        - "谢谢夸奖！记得一键三连支持一下哦~ 💖"
    - keywords: ["怎么做", "教程", "源码", "工具", "开源"]
      replies:
        - "相关工具和配置我们会在后续专栏或置顶中详细分享，欢迎持续关注！🤖"
    - default_replies:
        - "感谢支持！欢迎在评论区多多交流~ 🌟"
        - "收到你的反馈啦，感谢观看！❤️"

  # 大模型智能回复 (如 reply_mode 为 "llm")
  llm:
    api_base: "https://api.openai.com/v1"
    api_key: ""
    model: "gpt-4o-mini"
    prompt: "你是B站UP主的AI运营助手，请用友善、风趣且接地气的B站用户口吻简短回复粉丝评论（50字以内）："

# 数据监控配置
analytics:
  enabled: true
  collect_interval_hours: 6   # 数据采集间隔 (小时)
  generate_daily_report: true # 每天自动生成 Markdown 报表
  report_hour: 8              # 每天生成报表的时间 (0-23)
